# pytest settings - added by Kyle Lewis 10/26/26
# Run all the tests from the project folder with:   pytest
# With a coverage report:                           pytest --cov --cov-report=html
[pytest]
testpaths = backend/tests
pythonpath = . backend
python_files = test_*.py
addopts = -ra
    --ignore=backend/tests/test_wishlist_unit.py
    --ignore=backend/tests/test_listing_routes.py
