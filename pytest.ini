# pytest settings - added by Kyle Lewis 10/26/26
# Run all the tests from the project folder with:   pytest
# With a coverage report:                           pytest --cov --cov-report=html
[pytest]
testpaths = backend/tests
pythonpath = . backend
python_files = test_*.py
addopts = -ra
# test_checkout.py is left out because it tests old checkout routes that don't exist anymore
# (/api/checkout/summary and /api/checkout/prefill). It failed 8/8 before Iteration 3 too.
# Take this line out once that file is updated.
    --ignore=backend/tests/test_checkout.py
