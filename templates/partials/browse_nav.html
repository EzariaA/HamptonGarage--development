<div id="navOverlay" class="nav-overlay"></div>

<aside id="navPane" class="nav-pane">
    <div class="nav-top">
        <a href="{{ url_for('storefront_pages_bp.create_storefront_page') }}">
            <button class="create-btn">Create Storefront</button>
        </a>
        <a href="{{ url_for('create_listing') }}">
            <button class="create-btn">Create Listing</button>
        </a>
        <a href="/my-storefront">
            <button class="create-btn my-storefront-btn">My Storefront</button>
        </a>
        <hr class="nav-divider">
    </div>

    <nav class="nav-section" aria-label="Browse">
        <a href="{{ url_for('storefront') }}" class="nav-item">Storefronts <span>→</span></a>
        <a href="{{ url_for('recent_listings') }}"
           class="nav-item{% if active_page == 'recent' %} is-current{% endif %}"
           {% if active_page == 'recent' %}aria-current="page"{% endif %}>Recent Listings <span>→</span></a>
        <a href="{{ url_for('categories') }}"
           class="nav-item{% if active_page == 'categories' %} is-current{% endif %}"
           {% if active_page == 'categories' %}aria-current="page"{% endif %}>Categories <span>→</span></a>
    </nav>

    <a href="/returns" class="nav-subitem">Returns</a>
</aside>

<header class="topbar">
    <button class="icon-btn menu-btn" aria-label="Open navigation menu">
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
    </button>

    <!-- Site name in the middle of the blue banner (same as storefront.html) - Mason Johnson 11/12/26 -->
    <a href="/storefronts" class="topbar-title">HAMPTON GARAGE</a>

    <div class="topbar-actions">
        <a href="{{ url_for('auth.view_cart') }}" class="icon-btn bag-btn" aria-label="View shopping bag">
            <svg viewBox="0 0 24 24" class="topbar-svg" aria-hidden="true">
                <path d="M6 8h12l-1 11H7L6 8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </a>

        <a href="{{ url_for('auth.account') }}" class="profile-btn" aria-label="View account">
            <div class="profile-avatar">
                <svg viewBox="0 0 24 24" class="profile-svg" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
                    <path d="M5 19a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </a>
    </div>
</header>
