# Runs all the tests on every pull request - added by Kyle Lewis 10/26/26
# In GitHub, turn on branch protection (Settings -> Branches) and require the "pytest" check
# so a PR can't be merged unless the tests pass.
name: Tests

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL database just for the tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_NAME: vault_test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      SECRET_KEY: ci-only-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.5 pytest-cov==6.1.1

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=html --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
